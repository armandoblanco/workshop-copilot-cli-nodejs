name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: el workflow solo lee el repositorio.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Al inicio del workshop este paso falla a propósito (2 tests rojos en ?due=).
      # Se pone en verde en el Workshop 1, módulo 1.
      - run: npm test
